name: Deploy DHIS2 App (all servers)

on:
  push:
    branches: [main]

jobs:
  deploy:
    strategy:
      matrix:
        environment: [koshi, ocl]
      max-parallel: 1   # remove this line if you want parallel deploys instead
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate built zip
        id: findzip
        run: |
          ZIP_PATH=$(find . -name "*.zip" -path "*/build/*" | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No zip found — did you forget to commit the build?"
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy to DHIS2
        env:
          DHIS2_URL: ${{ secrets.INSTANCE_URL }}
          DHIS2_USER: ${{ secrets.USER }}
          DHIS2_PASS: ${{ secrets.PASS }}
        run: |
          curl -f -u "$DHIS2_USER:$DHIS2_PASS" \
            -X POST "$DHIS2_URL/api/apps" \
            -F "file=@${{ steps.findzip.outputs.zip_path }};type=application/zip"
