<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Card</title>
    <style>
        table.bordered td{border:1px solid #ddd}
        * { box-sizing:border-box; margin:0; padding:5px; }

        body {
            font-family: 'Noto Sans Devanagari', 'Arial Unicode MS', Arial, sans-serif;
            background: #d0d0d0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 12px;
        }

        .controls {
            /*display: flex;
            gap: 10px;*/
            background: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .controls button {
            padding: 7px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-print  { background: #1a6bb5; color: #fff; }

        #slip {
            min-width: 794px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            padding: 18px 22px;
            font-size: 11.5px;
            line-height: 1.5;
        }

        /* ── Print styles ── */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .controls{ display: none !important; }
            #slip {
                box-shadow: none;
                width: 100%;
                padding: 0; /*5mm 6mm*/;
                font-size: 11px;
            }
            /*@page {
                size: A4;
                margin: 8mm;
            }*/
        }
    </style>
</head>
<body>

<div class="controls">
    <button class="btn-print" id="btn-print">🖨️ Print</button>
</div>

<div id="slip">
    <div class="card" id="card"></div>
</div>

<script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
<script src="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="growth-chart.js"></script>
<script src="cards.js"></script>
<script>
    $(document).ready(function() {
        $('#btn-print').on('click', function() {
            window.print();
        });
    });
</script>
</body>
</html>
